name: Liquibase Automation

on:
  push:
    paths:
      - 'migrations/**'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para obtener información completa del commit
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Extract commit information
        id: commit_info
        run: |
          # Obtener información del commit
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')
          COMMIT_EMAIL=$(git log -1 --pretty=format:'%ae')
          COMMIT_HASH=$(git log -1 --pretty=format:'%h')
          
          # Exportar como variables de entorno para el siguiente step
          echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "COMMIT_EMAIL=$COMMIT_EMAIL" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          
          # También como outputs del step (alternativa)
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "email=$COMMIT_EMAIL" >> $GITHUB_OUTPUT
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          
          # Debug: mostrar la información capturada
          echo "📝 Información del commit:"
          echo "Autor: $COMMIT_AUTHOR"
          echo "Email: $COMMIT_EMAIL"  
          echo "Mensaje: $COMMIT_MESSAGE"
          echo "Hash: $COMMIT_HASH"
      
      - name: Run Liquibase annotation script
        run: |
          python scripts/liquibase_annotator.py \
            --author "${{ env.COMMIT_AUTHOR }}" \
            --message "${{ env.COMMIT_MESSAGE }}" \
            --email "${{ env.COMMIT_EMAIL }}" \
            --hash "${{ env.COMMIT_HASH }}"

